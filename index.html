<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#f2f7fb" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>IceProtocol — судейские протоколы фигурного катания</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = "light";
        try {
          var raw = localStorage.getItem("fsj:theme");
          var s = null;
          try { s = raw ? JSON.parse(raw) : raw; } catch (e2) { s = raw; }
          if (s === "light" || s === "dark") theme = s;
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!s && tg && tg.colorScheme) theme = tg.colorScheme;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      html { background: #f2f7fb; }
      html[data-theme="dark"] { background: #12101f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
